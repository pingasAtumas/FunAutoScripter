name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download static ffmpeg for bundling
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg .
          cp ffmpeg-*-amd64-static/ffprobe .
          chmod +x ffmpeg ffprobe

      - name: Build Linux binaries
        run: |
          pip install pyinstaller numpy scipy opencv-python matplotlib dearpygui
          pyinstaller --onefile --name funautoscripter \
            --add-binary "ffmpeg:." --add-binary "ffprobe:." \
            funautoscripter.py
          pyinstaller --onefile --name funautoscripter-gui \
            --add-binary "ffmpeg:." --add-binary "ffprobe:." \
            --add-data "src/gui/default_layout.ini:src/gui" \
            funautoscripter_gui.py

      - name: Upload Linux CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: funautoscripter-linux
          path: dist/funautoscripter

      - name: Upload Linux GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: funautoscripter-gui-linux
          path: dist/funautoscripter-gui

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download ffmpeg LGPL build for bundling
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter "bin" | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe" .
          Copy-Item "$($bin.FullName)\ffprobe.exe" .

      - name: Build Windows binaries
        run: |
          pip install pyinstaller numpy scipy opencv-python matplotlib dearpygui
          pyinstaller --onefile --name funautoscripter --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." funautoscripter.py
          pyinstaller --onefile --name funautoscripter-gui --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "src/gui/default_layout.ini;src/gui" funautoscripter_gui.py

      - name: Upload Windows CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: funautoscripter-windows
          path: dist/funautoscripter.exe

      - name: Upload Windows GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: funautoscripter-gui-windows
          path: dist/funautoscripter-gui.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux CLI binary
        uses: actions/download-artifact@v4
        with:
          name: funautoscripter-linux
          path: artifacts/linux

      - name: Download Linux GUI binary
        uses: actions/download-artifact@v4
        with:
          name: funautoscripter-gui-linux
          path: artifacts/linux

      - name: Download Windows CLI binary
        uses: actions/download-artifact@v4
        with:
          name: funautoscripter-windows
          path: artifacts/windows

      - name: Download Windows GUI binary
        uses: actions/download-artifact@v4
        with:
          name: funautoscripter-gui-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/funautoscripter
            artifacts/linux/funautoscripter-gui
            artifacts/windows/funautoscripter.exe
            artifacts/windows/funautoscripter-gui.exe
          generate_release_notes: true
